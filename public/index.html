<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人事管理系统 · 人员总览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       DESIGN TOKENS
       ═══════════════════════════════════════════ */
    :root {
      --bg: #FAF7F2;
      --bg-warm: #F5F0E8;
      --surface: #FFFFFF;
      --ink: #1A1A2E;
      --ink-soft: #3D3D56;
      --ink-muted: #7A7A8E;
      --amber: #C8860A;
      --amber-light: #F5D98A;
      --amber-glow: rgba(200, 134, 10, 0.12);
      --terracotta: #B85C38;
      --sage: #6B8F71;
      --sage-light: #E8F0E9;
      --border: rgba(26, 26, 46, 0.08);
      --border-strong: rgba(26, 26, 46, 0.15);
      --shadow-sm: 0 1px 3px rgba(26, 26, 46, 0.04), 0 1px 2px rgba(26, 26, 46, 0.06);
      --shadow-md: 0 4px 16px rgba(26, 26, 46, 0.06), 0 2px 4px rgba(26, 26, 46, 0.04);
      --shadow-lg: 0 12px 40px rgba(26, 26, 46, 0.08), 0 4px 12px rgba(26, 26, 46, 0.04);
      --shadow-amber: 0 8px 30px rgba(200, 134, 10, 0.15);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
      --font-serif: 'Noto Serif SC', 'Songti SC', serif;
      --font-sans: 'Noto Sans SC', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }

    /* ═══════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Grain texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px;
    }

    /* ═══════════════════════════════════════════
       LAYOUT
       ═══════════════════════════════════════════ */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ═══════════════════════════════════════════
       HERO SECTION
       ═══════════════════════════════════════════ */
    .hero {
      padding: 72px 0 48px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: -60%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--amber-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--amber-light);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      animation: fadeSlideUp 0.6s ease both;
    }

    .hero-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(40px, 5.5vw, 64px);
      font-weight: 900;
      line-height: 1.15;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      animation: fadeSlideUp 0.6s ease 0.1s both;
    }

    .hero-title .accent {
      color: var(--amber);
      position: relative;
    }

    .hero-title .accent::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--amber-light);
      border-radius: 2px;
    }

    .hero-subtitle {
      font-size: 17px;
      color: var(--ink-muted);
      max-width: 560px;
      line-height: 1.8;
      font-weight: 300;
      animation: fadeSlideUp 0.6s ease 0.2s both;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      animation: fadeSlideUp 0.6s ease 0.3s both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════════ */
    .btn {
      appearance: none;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 24px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--ink-soft);
      box-shadow: var(--shadow-lg);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      border: 1.5px solid var(--border-strong);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--ink);
      color: var(--ink);
      background: rgba(26, 26, 46, 0.02);
    }

    /* ═══════════════════════════════════════════
       FILTER PANEL
       ═══════════════════════════════════════════ */
    .filter-panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      animation: fadeSlideUp 0.6s ease 0.4s both;
    }

    .filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .filter-header h2 {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }

    .filter-header .result-count {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
      transition: background 0.3s;
    }

    .result-dot.loading { background: var(--amber); animation: pulse 1.5s ease infinite; }
    .result-dot.error { background: var(--terracotta); }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    .filter-group select {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%237A7A8E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 36px;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-glow);
    }

    .filter-group input::placeholder {
      color: var(--ink-muted);
      font-weight: 300;
    }

    /* ═══════════════════════════════════════════
       STATS CARDS
       ═══════════════════════════════════════════ */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
      animation: fadeSlideUp 0.6s ease 0.5s both;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
    }

    .stat-card:nth-child(1)::before { background: var(--amber); }
    .stat-card:nth-child(2)::before { background: var(--sage); }
    .stat-card:nth-child(3)::before { background: var(--terracotta); }
    .stat-card:nth-child(4)::before { background: var(--ink); }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.1;
    }

    .stat-value.small {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }

    .stat-detail {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    /* ═══════════════════════════════════════════
       EMPLOYEE CARDS
       ═══════════════════════════════════════════ */
    .results-section {
      animation: fadeSlideUp 0.6s ease 0.6s both;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
    }

    .section-header .count-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--amber-glow);
      color: var(--amber);
      font-weight: 500;
    }

    .employee-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .employee-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .employee-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-strong);
    }

    .employee-card .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .employee-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .employee-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-muted);
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .employee-name {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .employee-position {
      font-size: 13px;
      color: var(--amber);
      font-weight: 500;
      margin-bottom: 16px;
    }

    .employee-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .meta-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .meta-label {
      color: var(--ink-muted);
      font-size: 11px;
      min-width: 32px;
    }

    .meta-value {
      font-weight: 500;
    }

    .dept-tag {
      display: inline-flex;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--sage-light);
      color: var(--sage);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 64px 32px;
      border-radius: var(--radius-lg);
      border: 2px dashed var(--border);
      background: var(--bg-warm);
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state h3 {
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--ink-muted);
      font-size: 14px;
    }

    /* ═══════════════════════════════════════════
       API PREVIEW
       ══════════════════════════════════════════ */
    .api-section {
      margin-top: 32px;
      margin-bottom: 64px;
      animation: fadeSlideUp 0.6s ease 0.7s both;
    }

    .api-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-muted);
      background: none;
      border: none;
      font-family: var(--font-sans);
      padding: 8px 0;
      transition: color 0.2s;
    }

    .api-toggle:hover { color: var(--ink); }

    .api-toggle .chevron {
      transition: transform 0.3s;
      font-size: 12px;
    }

    .api-toggle.open .chevron { transform: rotate(90deg); }

    .api-preview {
      margin-top: 12px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--ink);
      display: none;
    }

    .api-preview.visible { display: block; }

    .api-preview-header {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .api-preview-header .dot-red { width: 10px; height: 10px; border-radius: 50%; background: #FF5F57; }
    .api-preview-header .dot-yellow { width: 10px; height: 10px; border-radius: 50%; background: #FFBD2E; }
    .api-preview-header .dot-green { width: 10px; height: 10px; border-radius: 50%; background: #28CA42; }

    .api-preview pre {
      padding: 20px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.7;
      color: #A5D6FF;
      max-height: 400px;
    }

    .api-preview pre::-webkit-scrollbar { width: 6px; height: 6px; }
    .api-preview pre::-webkit-scrollbar-track { background: transparent; }
    .api-preview pre::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    /* ═══════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════ */
    .footer {
      text-align: center;
      padding: 32px 0 48px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--ink-muted);
    }

    .footer a {
      color: var(--amber);
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }

    /* ═══════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════ */
    @media (max-width: 900px) {
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .page { padding: 0 16px; }
      .hero { padding: 40px 0 32px; }
      .filter-panel { padding: 20px; }
      .filter-grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .employee-grid { grid-template-columns: 1fr; }
    }

    /* ═══════════════════════════════════════════
       CARD STAGGER ANIMATION
       ═══════════════════════════════════════════ */
    .employee-card {
      opacity: 0;
      animation: cardIn 0.4s ease forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- ══ HERO ═══ -->
    <section class="hero">
      <div class="hero-badge">HR Management System</div>
      <h1 class="hero-title">人事<span class="accent">管理</span>系统</h1>
      <p class="hero-subtitle">
        支持姓名模糊搜索、部门精确筛选、年龄区间过滤、多维排序与结果限制，
        实时展示筛选结果集的统计概览。
      </p>
      <div class="hero-actions">
        <button id="refreshBtn" class="btn btn-primary" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          刷新数据
        </button>
        <a class="btn btn-ghost" href="/api/employees" target="_blank" rel="noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          查看接口
        </a>
      </div>
    </section>

    <!-- ═══ FILTER PANEL ═══ -->
    <section class="filter-panel">
      <div class="filter-header">
        <h2>筛选条件</h2>
        <div class="result-count">
          <span id="resultDot" class="result-dot loading"></span>
          <span id="resultText">正在加载...</span>
        </div>
      </div>
      <div class="filter-grid">
        <div class="filter-group">
          <label for="nameInput">姓名关键字</label>
          <input id="nameInput" type="text" placeholder="例如：张">
        </div>
        <div class="filter-group">
          <label for="deptSelect">部门</label>
          <select id="deptSelect">
            <option value="">全部部门</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="minAgeInput">最小年龄</label>
          <input id="minAgeInput" type="number" min="0" max="80" placeholder="例如：26">
        </div>
        <div class="filter-group">
          <label for="maxAgeInput">最大年龄</label>
          <input id="maxAgeInput" type="number" min="0" max="80" placeholder="例如：32">
        </div>
        <div class="filter-group">
          <label for="sortBySelect">排序字段</label>
          <select id="sortBySelect">
            <option value="id">编号</option>
            <option value="name">姓名</option>
            <option value="age">年龄</option>
            <option value="hireDate">入职日期</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="orderSelect">排序方向</label>
          <select id="orderSelect">
            <option value="asc">升序 ↑</option>
            <option value="desc">降序 ↓</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="limitSelect">结果条数</label>
          <select id="limitSelect">
            <option value="">全部</option>
            <option value="5">5 条</option>
            <option value="10">10 条</option>
            <option value="20">20 条</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ═══ STATS ═══ -->
    <section class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-label">当前结果数</div>
        <div class="stat-value" id="statCount">—</div>
        <div class="stat-detail">筛选后总条数</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">平均年龄</div>
        <div class="stat-value" id="statAvg">—</div>
        <div class="stat-detail">岁</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">年龄范围</div>
        <div class="stat-value small" id="statRange">—</div>
        <div class="stat-detail">最小 ~ 最大</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">涉及部门</div>
        <div class="stat-value small" id="statDepts">—</div>
        <div class="stat-detail">个部门</div>
      </div>
    </section>

    <!-- ═══ EMPLOYEE CARDS ═══ -->
    <section class="results-section">
      <div class="section-header">
        <h2>人员列表</h2>
        <span class="count-badge" id="listBadge">0 人</span>
      </div>
      <div class="employee-grid" id="employeeGrid"></div>
    </section>

    <!-- ═══ API PREVIEW ═══ -->
    <section class="api-section">
      <button class="api-toggle" id="apiToggle" type="button">
        <span class="chevron">▶</span> 接口响应预览
      </button>
      <div class="api-preview" id="apiPreview">
        <div class="api-preview-header">
          <span class="dot-red"></span>
          <span class="dot-yellow"></span>
          <span class="dot-green"></span>
        </div>
        <pre id="apiPayload"></pre>
      </div>
    </section>

    <!-- ═══ FOOTER ═══ -->
    <footer class="footer">
      人事管理系统 · 基于 Spring Boot 构建 · <a href="/api/departments" target="_blank">部门接口</a>
    </footer>
  </main>

  <script>
    /* ═══════════════════════════════════════════
       AVATAR COLORS
       ═══════════════════════════════════════════ */
    const AVATAR_COLORS = [
      '#C8860A', '#B85C38', '#6B8F71', '#4A6FA5',
      '#8B5E83', '#2D7D7B', '#A0522D', '#5B7FA5',
      '#7B6B8D', '#6B8E6B', '#C47A5A', '#5A7D8B'
    ];

    function avatarColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    /* ═══════════════════════════════════════════
       DOM REFS
       ═══════════════════════════════════════════ */
    const $ = (id) => document.getElementById(id);
    const refreshBtn = $('refreshBtn');
    const resultDot = $('resultDot');
    const resultText = $('resultText');
    const employeeGrid = $('employeeGrid');
    const apiPayload = $('apiPayload');
    const apiToggle = $('apiToggle');
    const apiPreview = $('apiPreview');

    const nameInput = $('nameInput');
    const deptSelect = $('deptSelect');
    const minAgeInput = $('minAgeInput');
    const maxAgeInput = $('maxAgeInput');
    const sortBySelect = $('sortBySelect');
    const orderSelect = $('orderSelect');
    const limitSelect = $('limitSelect');

    /* ═══════════════════════════════════════════
       API TOGGLE
       ═══════════════════════════════════════════ */
    apiToggle.addEventListener('click', () => {
      apiToggle.classList.toggle('open');
      apiPreview.classList.toggle('visible');
    });

    /* ═══════════════════════════════════════════
       STATUS
       ═══════════════════════════════════════════ */
    function setStatus(type, text) {
      resultDot.className = `result-dot ${type}`;
      resultText.textContent = text;
    }

    /* ═══════════════════════════════════════════
       RENDER STATS
       ═══════════════════════════════════════════ */
    function renderStats(stats, total) {
      $('statCount').textContent = stats.count ?? total ?? 0;
      $('statAvg').textContent = stats.avgAge ?? 0;
      $('statRange').textContent = `${stats.minAge ?? 0} ~ ${stats.maxAge ?? 0}`;
      const deptCount = (stats.departments || []).length;
      $('statDepts').textContent = deptCount;
      $('statDepts').nextElementSibling.textContent = deptCount ? '个部门' : '暂无数据';
    }

    /* ══════════════════════════════════════════
       RENDER EMPLOYEE CARDS
       ═══════════════════════════════════════════ */
    function renderCards(people) {
      $('listBadge').textContent = `${people.length} 人`;

      if (!people.length) {
        employeeGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">🔍</div>
            <h3>未找到匹配人员</h3>
            <p>请尝试调整筛选条件</p>
          </div>`;
        return;
      }

      employeeGrid.innerHTML = people.map((p, i) => `
        <article class="employee-card" style="animation-delay: ${i * 0.04}s">
          <div class="card-top">
            <div class="employee-avatar" style="background: ${avatarColor(p.name)}">${p.name[0]}</div>
            <span class="employee-id">#${String(p.id).padStart(3, '0')}</span>
          </div>
          <div class="employee-name">${p.name}</div>
          <div class="employee-position">${p.position}</div>
          <div class="employee-meta">
            <div class="meta-row">
              <div class="meta-icon"></div>
              <span class="dept-tag">${p.department}</span>
            </div>
            <div class="meta-row">
              <div class="meta-icon">🎂</div>
              <span class="meta-label">年龄</span>
              <span class="meta-value">${p.age} 岁</span>
            </div>
            <div class="meta-row">
              <div class="meta-icon">✉</div>
              <span class="meta-label">邮箱</span>
              <span class="meta-value" style="font-size:12px;color:var(--ink-muted)">${p.email}</span>
            </div>
            <div class="meta-row">
              <div class="meta-icon">📅</div>
              <span class="meta-label">入职</span>
              <span class="meta-value">${p.hireDate}</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    /* ═══════════════════════════════════════════
       SYNC DEPARTMENT OPTIONS
       ═══════════════════════════════════════════ */
    function syncDepartments(departments) {
      const current = deptSelect.value;
      deptSelect.innerHTML = [
        '<option value="">全部部门</option>',
        ...departments.map(d => `<option value="${d}">${d}</option>`)
      ].join('');
      if (departments.includes(current)) deptSelect.value = current;
    }

    /* ═══════════════════════════════════════════
       BUILD QUERY
       ═══════════════════════════════════════════ */
    function buildQuery() {
      const params = new URLSearchParams();
      if (nameInput.value.trim()) params.set('name', nameInput.value.trim());
      if (deptSelect.value) params.set('department', deptSelect.value);
      if (minAgeInput.value) params.set('minAge', minAgeInput.value);
      if (maxAgeInput.value) params.set('maxAge', maxAgeInput.value);
      if (sortBySelect.value) params.set('sortBy', sortBySelect.value);
      if (orderSelect.value) params.set('sortOrder', orderSelect.value);
      if (limitSelect.value) params.set('limit', limitSelect.value);
      return params.toString();
    }

    /* ═══════════════════════════════════════════
       LOAD DATA
       ═══════════════════════════════════════════ */
    async function loadData() {
      setStatus('loading', '正在加载...');
      refreshBtn.disabled = true;

      try {
        const query = buildQuery();
        const url = `/api/employees${query ? '?' + query : ''}`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });

        if (!res.ok) throw new Error(`请求失败：${res.status}`);

        const json = await res.json();
        const { list, total, stats } = json.data;

        syncDepartments(stats.departments || []);
        renderStats(stats, total);
        renderCards(list);
        apiPayload.textContent = JSON.stringify(json, null, 2);
        setStatus('success', `加载成功，共 ${total} 条数据`);
      } catch (err) {
        $('statCount').textContent = '—';
        $('statAvg').textContent = '—';
        $('statRange').textContent = '—';
        $('statDepts').textContent = '—';
        employeeGrid.innerHTML = '';
        apiPayload.textContent = err.message;
        setStatus('error', '加载失败，请稍后重试');
      } finally {
        refreshBtn.disabled = false;
      }
    }

    /* ═══════════════════════════════════════════
       EVENT BINDINGS
       ═══════════════════════════════════════════ */
    refreshBtn.addEventListener('click', loadData);

    [deptSelect, minAgeInput, maxAgeInput, sortBySelect, orderSelect, limitSelect]
      .forEach(el => el.addEventListener('change', loadData));

    nameInput.addEventListener('input', debounce(loadData, 350));

    function debounce(fn, ms) {
      let timer;
      return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
    }

    // Initial load
    loadData();
  </script>
</body>
</html>
